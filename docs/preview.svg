<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Six memory layers feeding a recall card into a conversation, with an audit chain">
  <rect width="640" height="300" rx="18" fill="#0f1c2e"/>
  <rect x="0.5" y="0.5" width="639" height="299" rx="18" fill="none" stroke="#22344f"/>

  <!-- 六层记忆：L0-L5 -->
  <g>
    <rect x="36" y="52" width="176" height="20" rx="6" fill="#1d3a5c"/>
    <rect x="36" y="80" width="176" height="20" rx="6" fill="#1d3a5c"/>
    <rect x="36" y="108" width="176" height="20" rx="6" fill="#24476f"/>
    <rect x="36" y="136" width="176" height="20" rx="6" fill="#2b5483"/>
    <rect x="36" y="164" width="176" height="20" rx="6" fill="#3f7fc4"/>
    <rect x="36" y="192" width="176" height="20" rx="6" fill="#5aa0e8"/>
    <circle cx="36" cy="230" r="4" fill="#e8a33d"/>
    <path d="M46 230 H212" stroke="#2b5483" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- 检索箭头 -->
  <path d="M228 156 H292" stroke="#5aa0e8" stroke-width="3" stroke-linecap="round"/>
  <path d="M286 149 L296 156 L286 163 Z" fill="#5aa0e8"/>

  <!-- 召回卡 -->
  <rect x="300" y="112" width="118" height="88" rx="12" fill="#132437" stroke="#2b5483"/>
  <rect x="314" y="130" width="76" height="8" rx="4" fill="#5aa0e8"/>
  <rect x="314" y="146" width="90" height="6" rx="3" fill="#33527a"/>
  <rect x="314" y="160" width="62" height="6" rx="3" fill="#33527a"/>
  <rect x="314" y="180" width="34" height="8" rx="4" fill="#e8a33d"/>

  <!-- 对话气泡（问题 + 记忆） -->
  <rect x="444" y="86" width="160" height="58" rx="14" fill="#1b3250"/>
  <rect x="462" y="104" width="112" height="7" rx="3.5" fill="#7fb6ec"/>
  <rect x="462" y="120" width="74" height="7" rx="3.5" fill="#3f6b9c"/>
  <rect x="444" y="160" width="160" height="72" rx="14" fill="#132437" stroke="#2b5483"/>
  <rect x="462" y="178" width="96" height="7" rx="3.5" fill="#5aa0e8"/>
  <rect x="462" y="194" width="118" height="7" rx="3.5" fill="#33527a"/>
  <rect x="462" y="210" width="66" height="7" rx="3.5" fill="#33527a"/>

  <!-- 闸门盾牌 -->
  <path d="M104 244 L104 262 C104 276 118 284 128 288 C138 284 152 276 152 262 L152 244 L128 238 Z" fill="#12352b" stroke="#3fbf87" stroke-width="2.5"/>
  <path d="M116 260 L125 269 L141 251" stroke="#3fbf87" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 审计链 -->
  <g stroke="#e8a33d" stroke-width="2" fill="none">
    <circle cx="330" cy="248" r="6" fill="#1a2436"/>
    <circle cx="360" cy="248" r="6" fill="#1a2436"/>
    <circle cx="390" cy="248" r="6" fill="#1a2436"/>
    <path d="M336 248 H354"/>
    <path d="M366 248 H384"/>
    <path d="M396 248 H452"/>
  </g>
  <circle cx="452" cy="248" r="4" fill="#e8a33d"/>
</svg>
